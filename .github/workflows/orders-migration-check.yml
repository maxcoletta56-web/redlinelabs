name: orders migration check

on:
  push:
    branches:
      - rlorders-table-schema-migration-35a1

permissions:
  contents: write

jobs:
  postgres:
    name: apply the migration to a real postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify against postgres
        continue-on-error: true
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set +e
          {
            echo "=== generated migration ==="
            node -e "import('./scripts/orders-migration.mjs').then((m) => console.log(m.ordersMigrationSql()))"
            echo "=== postgres verification ==="
            node scripts/verify-orders-migration.mjs
            echo "verification exit: $?"
            echo "=== unit tests ==="
            node --experimental-strip-types --test src/lib/orders-migration.test.ts src/lib/orders-schema.test.ts
            echo "tests exit: $?"
          } > /tmp/verification.log 2>&1
          cat /tmp/verification.log
      - name: Publish the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logpush && cd /tmp/logpush
          cp /tmp/verification.log .
          git init -q
          git add verification.log
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "orders migration verification ${{ github.sha }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/tmp-orders-migration-verification
