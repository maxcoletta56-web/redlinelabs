name: CI

on:
  pull_request:
  push:
    branches:
      # Requested protection target. This repository does not have a main
      # branch yet; Vercel production is cursor/redlinelabs-shop-1c01.
      - main
      - cursor/redlinelabs-shop-1c01

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build, lint, and typecheck do not read these. Placeholders are
          # listed so a future required read stays obvious and never uses a
          # real secret. Stripe key shapes match src/lib/stripe-keys.ts.
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ASSISTLOOP_AGENT_ID: ci-placeholder
